<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - PACE AI</title>

    <!-- Fonte Inter do Google Fonts (usada no Figma) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Folha de Estilos Externa -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Container Principal da Tela do Aplicativo -->
    <main class="app-container">
      <div class="screen-card">
        
        <!-- Topo: Logo da Marca PACE AI (no lugar das etapas) -->
        <header class="brand-header">
          <div class="logo">
            <!-- Ícone do Pulso Cardíaco da Marca -->
            <svg class="logo-pulse" width="42" height="42" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                d="M42.5 22H37.416C36.5201 21.9981 35.6482 22.2897 34.9337 22.8302C34.2192 23.3707 33.7014 24.1304 33.4595 24.993L28.642 42.131C28.6109 42.2375 28.5462 42.331 28.4575 42.3975C28.3688 42.464 28.2609 42.5 28.15 42.5C28.0391 42.5 27.9312 42.464 27.8425 42.3975C27.7538 42.331 27.6891 42.2375 27.658 42.131L16.342 1.869C16.311 1.76255 16.2462 1.66903 16.1575 1.6025C16.0688 1.53597 15.9609 1.5 15.85 1.5C15.7391 1.5 15.6312 1.53597 15.5425 1.6025C15.4538 1.66903 15.389 1.76255 15.358 1.869L10.5405 19.007C10.2996 19.8663 9.78483 20.6235 9.07447 21.1636C8.36411 21.7038 7.49691 21.9974 6.6045 22H1.5"
                stroke="#00FF66"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
            <span class="logo-text">PACE</span>
            <span class="logo-ai">AI</span>
          </div>
        </header>

        <!-- Cabeçalho do Formulário (Título e Subtítulo) -->
        <section class="form-intro">
          <h1 class="form-title">Crie sua conta</h1>
          <p class="form-subtitle">Para começar, informe seus dados pessoais.</p>
        </section>

        <!-- Formulário de Cadastro -->
        <form class="signup-form" action="#" method="POST">
          
          <!-- Campo 1: Nome Completo -->
          <div class="form-group">
            <label for="fullName" class="form-label">Nome completo</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form-input"
              placeholder="Digite seu nome completo"
              required
            />
          </div>

          <!-- Campo 2: CPF -->
          <div class="form-group">
            <label for="cpf" class="form-label">CPF</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              class="form-input"
              placeholder="000.000.000-00"
              required
            />
          </div>

          <!-- Campo 3: E-mail -->
          <div class="form-group">
            <label for="email" class="form-label">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="Digite seu e-mail"
              required
            />
            <p class="form-helper">
              Você receberá um código neste e-mail para confirmar seu cadastro.
            </p>
          </div>

          <!-- Botão Principal de Ação -->
          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <span>Continuar</span>
              <svg
                class="btn-arrow"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="M12 5l7 7-7 7" />
              </svg>
            </button>
          </div>

        </form>

      </div>
    </main>
  </body>
</html>
