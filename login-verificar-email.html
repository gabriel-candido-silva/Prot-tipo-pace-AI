<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifique seu e-mail - PACE AI</title>

    <!-- Fonte Inter do Google Fonts (usada no Figma) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Folha de Estilos Externa -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Container Principal da Tela do Aplicativo -->
    <main class="app-container">
      <div class="screen-card">
        <!-- Barra de Status do Dispositivo (Estilo iOS) -->
        <header class="device-status-bar" aria-label="Status do dispositivo">
          <span class="status-time">16:16</span>
          <div class="status-icons">
            <svg
              width="17"
              height="11"
              viewBox="0 0 17 11"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="Sinal celular"
            >
              <path
                d="M1 9.5H3V10.5H1V9.5ZM5 7H7V10.5H5V7ZM9 4.5H11V10.5H9V4.5ZM13 1H15V10.5H13V1Z"
                fill="currentColor"
              />
            </svg>
            <svg
              width="16"
              height="11"
              viewBox="0 0 16 11"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="Wi-Fi"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M8 2.5C10.74 2.5 13.23 3.56 15.09 5.29L16 4.38C13.9 2.42 11.09 1.25 8 1.25C4.91 1.25 2.1 2.42 0 4.38L0.91 5.29C2.77 3.56 5.26 2.5 8 2.5ZM8 6C9.72 6 11.28 6.66 12.44 7.74L13.35 6.83C11.96 5.54 10.07 4.75 8 4.75C5.93 4.75 4.04 5.54 2.65 6.83L3.56 7.74C4.72 6.66 6.28 6 8 6ZM8 9.25C8.97 9.25 9.75 10.03 9.75 11H6.25C6.25 10.03 7.03 9.25 8 9.25Z"
                fill="currentColor"
              />
            </svg>
            <svg
              width="25"
              height="12"
              viewBox="0 0 25 12"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="Bateria"
            >
              <rect
                x="0.5"
                y="0.5"
                width="21"
                height="11"
                rx="3.5"
                stroke="currentColor"
              />
              <rect
                x="2"
                y="2"
                width="18"
                height="8"
                rx="2"
                fill="currentColor"
              />
              <path
                d="M23 4C23.8284 4 24.5 4.67157 24.5 5.5V6.5C24.5 7.32843 23.8284 8 23 8V4Z"
                fill="currentColor"
              />
            </svg>
          </div>
        </header>

        <!-- Navegação / Voltar para a Tela de Login -->
        <nav class="back-header" aria-label="Navegação secundária">
          <a href="login.html" class="btn-back">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 18l-6-6 6-6" />
            </svg>
            <span>Voltar</span>
          </a>
        </nav>

        <!-- Topo: Logo da Marca PACE AI -->
        <header class="brand-header">
          <div class="logo">
            <!-- Ícone do Pulso Cardíaco da Marca -->
            <svg
              class="logo-pulse"
              width="42"
              height="42"
              viewBox="0 0 44 44"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M42.5 22H37.416C36.5201 21.9981 35.6482 22.2897 34.9337 22.8302C34.2192 23.3707 33.7014 24.1304 33.4595 24.993L28.642 42.131C28.6109 42.2375 28.5462 42.331 28.4575 42.3975C28.3688 42.464 28.2609 42.5 28.15 42.5C28.0391 42.5 27.9312 42.464 27.8425 42.3975C27.7538 42.331 27.6891 42.2375 27.658 42.131L16.342 1.869C16.311 1.76255 16.2462 1.66903 16.1575 1.6025C16.0688 1.53597 15.9609 1.5 15.85 1.5C15.7391 1.5 15.6312 1.53597 15.5425 1.6025C15.4538 1.66903 15.389 1.76255 15.358 1.869L10.5405 19.007C10.2996 19.8663 9.78483 20.6235 9.07447 21.1636C8.36411 21.7038 7.49691 21.9974 6.6045 22H1.5"
                stroke="#00FF66"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
            <span class="logo-text">PACE</span>
            <span class="logo-ai">AI</span>
          </div>
        </header>

        <!-- Cabeçalho do Formulário (Título e Subtítulo do Figma) -->
        <section class="form-intro">
          <h1 class="form-title">Verifique seu e-mail</h1>
          <p class="form-subtitle">
            Um código de verificação foi enviado ao seu e-mail. Por favor,
            informe o código para continuar.
          </p>
        </section>

        <!-- Formulário de Código de Verificação (ao verificar leva para o dashboard) -->
        <form class="signup-form login-verify-form" action="inicio.html" method="GET">
          <!-- Bloco do Código de 4 Dígitos -->
          <div class="code-container">
            <label class="form-label" for="lv-digit-1">Código de verificação</label>
            <div class="code-digits-row">
              <input
                type="text"
                id="lv-digit-1"
                name="digit1"
                class="code-digit-input"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                placeholder="•"
                required
                autofocus
              />
              <input
                type="text"
                id="lv-digit-2"
                name="digit2"
                class="code-digit-input"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                placeholder="•"
                required
              />
              <input
                type="text"
                id="lv-digit-3"
                name="digit3"
                class="code-digit-input"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                placeholder="•"
                required
              />
              <input
                type="text"
                id="lv-digit-4"
                name="digit4"
                class="code-digit-input"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                placeholder="•"
                required
              />
            </div>

            <!-- Informações de Expiração e Link de Reenvio (Figma #2016:61 e #2016:62) -->
            <div class="code-timer-info">
              <p class="code-timer-text">O código expirará em 60 segundos</p>
              <button type="button" class="code-resend-link">
                Clique aqui para enviar outro código
              </button>
            </div>
          </div>

          <!-- Alerta de Código Incorreto (Figma #2016:63 — fill #F01317) -->
          <!-- Exibido via CSS com :has() e :user-invalid -->
          <div class="form-error-container" aria-live="polite">
            <p class="form-error-alert alert-code-invalid">Código incorreto!</p>
          </div>

          <!-- Botão Principal: Enviar Código (Figma #2016:51) -->
          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <span>Enviar Código</span>
              <svg
                class="btn-arrow"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14" />
                <path d="M12 5l7 7-7 7" />
              </svg>
            </button>
          </div>

          <!-- Texto de Termos (Figma #2016:40) -->
          <p class="terms-text">
            Ao continuar, você aceita os
            <a href="#" class="terms-link">Termos de Uso</a>
            e a
            <a href="#" class="terms-link">Política de Privacidade</a>.
          </p>
        </form>

        <!-- Indicador Home (iOS Indicator) -->
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </main>

    <!-- Script leve para auto-avanço de foco e suporte a colar código -->
    <script>
      const inputs = document.querySelectorAll('.login-verify-form .code-digit-input');

      inputs.forEach((input, index) => {
        // Aceita apenas números e avança o foco automaticamente
        input.addEventListener('input', (e) => {
          input.value = input.value.replace(/[^0-9]/g, '');
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        // Retorna o foco ao pressionar Backspace em campo vazio
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Seleciona o texto ao focar para facilitar substituição
        input.addEventListener('focus', () => {
          input.select();
        });

        // Suporte para colar código de 4 dígitos de uma vez
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData)
            .getData('text')
            .replace(/[^0-9]/g, '')
            .slice(0, inputs.length);

          if (pasteData) {
            [...pasteData].forEach((digit, i) => {
              if (inputs[i]) inputs[i].value = digit;
            });
            const targetIndex = Math.min(pasteData.length, inputs.length - 1);
            inputs[targetIndex].focus();
          }
        });
      });
    </script>
  </body>
</html>
