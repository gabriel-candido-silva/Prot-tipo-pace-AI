<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil - Nível - PACE AI</title>

    <!-- Fonte Inter do Google Fonts (usada no Figma) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Folha de Estilos Externa -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Container Principal da Tela do Aplicativo -->
    <main class="app-container">
      <div class="screen-card">
        <!-- Barra de Status do Dispositivo (Estilo iOS) -->
        <header class="device-status-bar" aria-label="Status do dispositivo">
          <span class="status-time">16:16</span>
          <div class="status-icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Sinal celular">
              <path d="M1 9.5H3V10.5H1V9.5ZM5 7H7V10.5H5V7ZM9 4.5H11V10.5H9V4.5ZM13 1H15V10.5H13V1Z" fill="currentColor" />
            </svg>
            <svg width="16" height="11" viewBox="0 0 16 11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Wi-Fi">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M8 2.5C10.74 2.5 13.23 3.56 15.09 5.29L16 4.38C13.9 2.42 11.09 1.25 8 1.25C4.91 1.25 2.1 2.42 0 4.38L0.91 5.29C2.77 3.56 5.26 2.5 8 2.5ZM8 6C9.72 6 11.28 6.66 12.44 7.74L13.35 6.83C11.96 5.54 10.07 4.75 8 4.75C5.93 4.75 4.04 5.54 2.65 6.83L3.56 7.74C4.72 6.66 6.28 6 8 6ZM8 9.25C8.97 9.25 9.75 10.03 9.75 11H6.25C6.25 10.03 7.03 9.25 8 9.25Z" fill="currentColor" />
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Bateria">
              <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" />
              <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor" />
              <path d="M23 4C23.8284 4 24.5 4.67157 24.5 5.5V6.5C24.5 7.32843 23.8284 8 23 8V4Z" fill="currentColor" />
            </svg>
          </div>
        </header>

        <!-- Topo com Navegação / Voltar -->
        <div class="onboarding-topbar">
          <a href="perfil-objetivos.html" class="onboarding-back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </a>
          <span class="onboarding-section-title">Seu perfil de treino</span>
          <a href="welcome.html" class="onboarding-exit-link">Sair</a>
        </div>

        <!-- Barra de Progresso em 4 Etapas -->
        <div class="onboarding-stepper">
          <div class="step-indicator completed"></div>
          <div class="step-indicator active"></div>
          <div class="step-indicator"></div>
          <div class="step-indicator"></div>
        </div>

        <div class="onboarding-step-counter">2 de 4</div>

        <!-- Título e Subtítulo da Etapa -->
        <div class="onboarding-heading">
          <h1 class="onboarding-title">Em que fase<br />você está?</h1>
          <p class="onboarding-desc">
            Sua experiência define o volume e a intensidade inicial. Sem pressa, sem comparações.
          </p>
        </div>

        <!-- Opções de Seleção de Nível -->
        <form action="perfil-infraestrutura.html" method="get" class="onboarding-form">
          <div class="selection-cards-list">
            <!-- Opção: Iniciante -->
            <label class="selection-card">
              <input type="radio" name="nivel" value="iniciante" />
              <div class="selection-card-content">
                <span class="selection-card-title">Iniciante</span>
                <span class="selection-card-sub">Estou começando ou voltando a treinar.</span>
              </div>
              <div class="selection-card-radio"></div>
            </label>

            <!-- Opção: Intermediário (Selecionada no Figma) -->
            <label class="selection-card selected">
              <input type="radio" name="nivel" value="intermediario" checked />
              <div class="selection-card-content">
                <span class="selection-card-title">Intermediário</span>
                <span class="selection-card-sub">Treino regularmente há 6–24 meses.</span>
              </div>
              <div class="selection-card-radio"></div>
            </label>

            <!-- Opção: Avançado -->
            <label class="selection-card">
              <input type="radio" name="nivel" value="avancado" />
              <div class="selection-card-content">
                <span class="selection-card-title">Avançado</span>
                <span class="selection-card-sub">Tenho mais de 2 anos de treino consistente.</span>
              </div>
              <div class="selection-card-radio"></div>
            </label>
          </div>

          <!-- Card de Feedback Contextual da IA -->
          <div class="context-feedback-card">
            <div class="feedback-icon-pulse">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00FF66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
              </svg>
            </div>
            <div class="feedback-text">
              <span class="feedback-title">Evolução no seu ritmo</span>
              <p class="feedback-desc">
                A IA ajusta a dificuldade com base nas suas cargas e na percepção de esforço.
              </p>
            </div>
          </div>

          <!-- Ação Principal -->
          <div class="onboarding-actions">
            <button type="submit" class="btn btn-primary btn-block">
              Continuar
            </button>
            <p class="onboarding-privacy-text">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              Seus dados são privados e protegidos.
            </p>
          </div>
        </form>

        <!-- Indicador de Navegação Inferior (Home Bar) -->
        <div class="home-indicator-bar" aria-hidden="true">
          <div class="home-indicator"></div>
        </div>
      </div>
    </main>
  </body>
</html>
