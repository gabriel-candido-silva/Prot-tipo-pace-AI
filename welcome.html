<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início - PACE AI</title>

    <!-- Fonte Inter do Google Fonts (usada no Figma) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Folha de Estilos Externa -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Container Principal do Aplicativo -->
    <main class="app-container">
      <div class="screen-card">
        <!-- Barra de Status do Dispositivo (Estilo iOS do Figma) -->
        <header class="device-status-bar" aria-label="Status do dispositivo">
          <span class="status-time">16:16</span>
          <div class="status-icons">
            <!-- Sinal celular -->
            <svg
              width="17"
              height="11"
              viewBox="0 0 17 11"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="Sinal celular"
            >
              <path
                d="M1 9.5H3V10.5H1V9.5ZM5 7H7V10.5H5V7ZM9 4.5H11V10.5H9V4.5ZM13 1H15V10.5H13V1Z"
                fill="currentColor"
              />
            </svg>
            <!-- Wi-Fi -->
            <svg
              width="16"
              height="11"
              viewBox="0 0 16 11"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="Wi-Fi"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M8 2.5C10.74 2.5 13.23 3.56 15.09 5.29L16 4.38C13.9 2.42 11.09 1.25 8 1.25C4.91 1.25 2.1 2.42 0 4.38L0.91 5.29C2.77 3.56 5.26 2.5 8 2.5ZM8 6C9.72 6 11.28 6.66 12.44 7.74L13.35 6.83C11.96 5.54 10.07 4.75 8 4.75C5.93 4.75 4.04 5.54 2.65 6.83L3.56 7.74C4.72 6.66 6.28 6 8 6ZM8 9.25C8.97 9.25 9.75 10.03 9.75 11H6.25C6.25 10.03 7.03 9.25 8 9.25Z"
                fill="currentColor"
              />
            </svg>
            <!-- Bateria -->
            <svg
              width="25"
              height="12"
              viewBox="0 0 25 12"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="Bateria"
            >
              <rect
                x="0.5"
                y="0.5"
                width="21"
                height="11"
                rx="3.5"
                stroke="currentColor"
              />
              <rect
                x="2"
                y="2"
                width="18"
                height="8"
                rx="2"
                fill="currentColor"
              />
              <path
                d="M23 4C23.8284 4 24.5 4.67157 24.5 5.5V6.5C24.5 7.32843 23.8284 8 23 8V4Z"
                fill="currentColor"
              />
            </svg>
          </div>
        </header>

        <!-- Conteúdo Principal da Tela de Boas-Vindas -->
        <div class="welcome-screen">
          <!-- Seção de Marca e Logo PACE AI -->
          <section class="welcome-brand-section">
            <div class="welcome-logo">
              <!-- Pulso Cardíaco da Marca PACE (Large) -->
              <svg
                class="welcome-pulse-icon"
                width="72"
                height="72"
                viewBox="0 0 78 78"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M76.5 39H67.2C65.5611 38.9965 63.9662 39.5299 62.6592 40.5186C61.3522 41.5074 60.405 42.897 59.9625 44.475L51.15 75.825C51.0932 76.0197 50.9748 76.1908 50.8125 76.3125C50.6502 76.4342 50.4528 76.5 50.25 76.5C50.0472 76.5 49.8498 76.4342 49.6875 76.3125C49.5252 76.1908 49.4068 76.0197 49.35 75.825L28.65 2.175C28.5932 1.98027 28.4748 1.80921 28.3125 1.6875C28.1502 1.56579 27.9528 1.5 27.75 1.5C27.5472 1.5 27.3498 1.56579 27.1875 1.6875C27.0252 1.80921 26.9068 1.98027 26.85 2.175L18.0375 33.525C17.5967 35.0968 16.6552 36.4819 15.3557 37.4701C14.0563 38.4582 12.4699 38.9953 10.8375 39H1.5"
                  stroke="#00FF66"
                  stroke-width="3"
                  stroke-linecap="round"
                />
              </svg>
              <span class="welcome-logo-text">PACE</span>
              <span class="welcome-logo-ai">AI</span>
            </div>
            <p class="welcome-tagline">
              Um plano feito para seu objetivo, seu corpo e sua vida.
            </p>
          </section>

          <!-- Bloco de Texto / Chamada -->
          <section class="welcome-hero">
            <h1 class="welcome-title">Seu próximo passo<br />começa aqui.</h1>
            <p class="welcome-subtitle">
              Crie sua conta para começar<br />ou entre com seu cadastro.
            </p>
          </section>

          <!-- Botões de Ação -->
          <div class="welcome-actions">
            <!-- Ação Primária: Criar Conta -->
            <a href="cadastro.html" class="btn-primary" id="btn-create-account">
              <span>Criar conta</span>
            </a>

            <!-- Ação Secundária: Já Tenho Conta (Login) -->
            <a href="login.html" class="btn-secondary" id="btn-login">
              <span>Já tenho conta</span>
            </a>
          </div>

          <!-- Termos e Privacidade -->
          <footer class="welcome-legal">
            <p>
              Ao continuar, você aceita os <a href="#">Termos de Uso</a><br />
              e a <a href="#">Política de Privacidade</a>.
            </p>
          </footer>

          <!-- Indicador Home (iOS Indicator) -->
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </div>
    </main>
  </body>
</html>
